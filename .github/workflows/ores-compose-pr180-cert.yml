name: certify ores-compose PR 181

on:
  pull_request:
    paths:
      - '.github/workflows/ores-compose-pr180-cert.yml'
      - 'certification/ores-compose-pr180/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REPO: ORESoftware/ores-compose
      SOURCE_SHA: 422266ec38564293a69954894b9cb710cf8a7427
      SOURCE_PATH: src/trusted_working_directory.rs
      SOURCE_BLOB_SHA: e3da217c72a0f3e34c7968f43d6b48b9c71801aa
      SOURCE_MAIN_WITH_FORMAL_PROOF: c505136a2ed01dc9d3d428dff89557261b219922
    steps:
      - name: Check out certification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove content-addressed source identity
        shell: bash
        run: |
          set -euo pipefail
          snapshot='certification/ores-compose-pr180/src/lib.rs'
          actual_blob="$(git hash-object "$snapshot")"
          test "$actual_blob" = "$SOURCE_BLOB_SHA" || {
            echo "expected source blob $SOURCE_BLOB_SHA, got $actual_blob" >&2
            exit 1
          }
          printf '%s\n' "$SOURCE_REPO@$SOURCE_SHA:$SOURCE_PATH" > source-identity.txt
          printf '%s\n' "$actual_blob" >> source-identity.txt
          printf '%s\n' "$SOURCE_MAIN_WITH_FORMAL_PROOF" > source-main.sha

      - name: Install exact reviewed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version | tee rustc-version.txt
          grep -F 'rustc 1.98.1' rustc-version.txt

      - name: Format exact changed source
        shell: bash
        working-directory: certification/ores-compose-pr180
        run: |
          set -o pipefail
          cargo fmt --all --check 2>&1 | tee ../../cargo-fmt.log

      - name: Clippy exact changed source
        shell: bash
        working-directory: certification/ores-compose-pr180
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee ../../cargo-clippy.log

      - name: Run all exact-source unit tests
        shell: bash
        working-directory: certification/ores-compose-pr180
        run: |
          set -o pipefail
          cargo test --all-targets 2>&1 | tee ../../cargo-test.log

      - name: Stress inode-replacement invariant
        shell: bash
        working-directory: certification/ores-compose-pr180
        run: |
          set -euo pipefail
          : > ../../inode-regression.log
          for attempt in $(seq 1 200); do
            output="$(cargo test replacement_after_admission_is_detected -- --nocapture 2>&1)"
            printf 'attempt=%s\n%s\n' "$attempt" "$output" >> ../../inode-regression.log
            printf '%s\n' "$output" | grep -Eq '1 passed; 0 failed|test .*replacement_after_admission_is_detected .* ok'
          done

      - name: Stress stable-content invariant
        shell: bash
        working-directory: certification/ores-compose-pr180
        run: |
          set -euo pipefail
          for attempt in $(seq 1 50); do
            output="$(cargo test directory_content_changes_do_not_change_admitted_identity -- --nocapture 2>&1)"
            printf '%s\n' "$output" | grep -Eq '1 passed; 0 failed|test .*directory_content_changes_do_not_change_admitted_identity .* ok'
          done

      - name: Upload immutable certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-compose-pr181-content-addressed-certification
          path: |
            source-identity.txt
            source-main.sha
            rustc-version.txt
            cargo-fmt.log
            cargo-clippy.log
            cargo-test.log
            inode-regression.log
          if-no-files-found: warn
          retention-days: 30
